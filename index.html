<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optiwise Image Inspector</title>
  <style>
    :root{--ink:#12231f;--muted:#6b7d77;--line:#dce8e2;--soft:#f4f8f6;--green:#18865f;--green-dark:#0d5f42;--mint:#e7f5ee;--shadow:0 20px 60px rgba(19,55,42,.08)}
    *{box-sizing:border-box}
    body{margin:0;background:#f7faf8;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .shell{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:58px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;font-size:16px;font-weight:850;letter-spacing:-.05em}
    .eyebrow{margin:0 0 3px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.16em}
    .brand-name{font-size:18px;font-weight:780;letter-spacing:-.02em}
    .top-note{color:var(--muted);font-size:13px}
    .hero{max-width:860px;margin-bottom:28px}
    h1{margin:0;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.06em}
    .hero p{margin:16px 0 0;color:var(--muted);font-size:17px;line-height:1.65}
    .scan-card{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow)}
    .field-label{display:block;margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#38534a}
    .scan-row{display:grid;grid-template-columns:minmax(0,1fr) 250px 130px;gap:10px;align-items:end}
    input,select{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:0 15px;outline:none;transition:border-color .18s,box-shadow .18s}
    input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(24,134,95,.12)}
    .primary{height:50px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;transition:background .18s,transform .18s}
    .primary:hover{background:var(--green-dark);transform:translateY(-1px)}
    .primary:disabled{cursor:wait;opacity:.7;transform:none}
    .hint{margin:12px 0 0;color:var(--muted);font-size:12px}
    .status{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5}
    .status.show{display:block;background:var(--mint);color:var(--green-dark)}
    .status.error{display:block;background:#fff0ef;color:#b03c35}
    .results{display:none;margin-top:48px}
    .results.show{display:block}
    .results-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
    .results-title{margin:0;font-size:25px;letter-spacing:-.04em}
    .results-meta{margin:6px 0 0;color:var(--muted);font-size:13px;word-break:break-all}
    .secondary{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--green-dark);font-size:13px;font-weight:750;white-space:nowrap}
    .secondary:hover{border-color:var(--green);background:var(--soft)}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .media-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(19,55,42,.05)}
    .preview{height:230px;padding:14px;background:linear-gradient(135deg,#f4f8f6,#edf4f0);display:grid;place-items:center}
    .preview img,.preview video{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}
    .preview .broken{width:100%;height:100%;display:grid;place-items:center;border:1px dashed #cbdcd4;border-radius:10px;color:var(--muted);font-size:13px}
    .card-body{padding:16px 17px 17px}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .type{color:var(--green);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    .index{color:#9aa9a3;font-size:12px;font-weight:700}
    .data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
    .data-label{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}
    .data-value{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
    .frame-note{margin:14px 0 0;padding-top:12px;border-top:1px solid #edf2ef;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{padding:54px 24px;border:1px dashed #cbdcd4;border-radius:18px;background:#fff;text-align:center;color:var(--muted)}
    .empty strong{display:block;margin-bottom:6px;color:var(--ink);font-size:16px}
    .loading{display:inline-flex;align-items:center;gap:8px}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.scan-row{grid-template-columns:minmax(0,1fr) 210px 120px}}
    @media(max-width:650px){.shell{padding:20px 15px 42px}.topbar{margin-bottom:38px}.top-note{display:none}.hero p{font-size:15px}.scan-card{padding:16px;border-radius:17px}.scan-row{grid-template-columns:1fr}.primary{width:100%}.results-head{align-items:flex-start;flex-direction:column}.gallery{grid-template-columns:1fr}.preview{height:250px}.data-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}.data-value{font-size:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo">IS</div><div><p class="eyebrow">OPTIWISE TOOL</p><div class="brand-name">Web Image Inspector</div></div></div>
      <div class="top-note">Website QA · Image sizing</div>
    </header>

    <section class="hero">
      <h1>ดูขนาดรูปภาพบนเว็บ<br>ได้ในครั้งเดียว</h1>
      <p>วาง URL เว็บไซต์ แล้วดูรูปภาพที่แสดงจริง พร้อมขนาดที่ใช้งานและขนาดต้นฉบับในหน้าจอเดียว</p>
    </section>

    <section class="scan-card" aria-label="ตรวจสอบเว็บไซต์">
      <div class="scan-row">
        <div><label class="field-label" for="url">URL หน้าเว็บไซต์</label><input id="url" type="url" placeholder="https://example.com" value="https://www.pttgcgroup.com/en/home"></div>
        <div><label class="field-label" for="viewport">ขนาดหน้าจอสำหรับตรวจ</label><select id="viewport">
          <option value="1920x1080" selected>Desktop · 1920 × 1080</option>
          <option value="1440x900">Desktop · 1440 × 900</option>
          <option value="1366x768">Laptop · 1366 × 768</option>
          <option value="1536x864">Desktop Wide · 1536 × 864</option>
          <option value="1280x800">Notebook · 1280 × 800</option>
          <option value="1024x768">Tablet · 1024 × 768</option>
          <option value="820x1180">iPad · 820 × 1180</option>
          <option value="430x932">Mobile Large · 430 × 932</option>
          <option value="390x844">Mobile · 390 × 844</option>
          <option value="375x812">Mobile Small · 375 × 812</option>
        </select></div>
        <button class="primary" id="scanBtn" type="button">ตรวจสอบ</button>
      </div>
      <p class="hint">ตรวจได้เฉพาะเว็บไซต์ Public ที่เปิดดูได้โดยไม่ต้อง Login · ระบบจะไม่เก็บ URL หรือรูปภาพ</p>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="results" id="results">
      <div class="results-head">
        <div><h2 class="results-title">รูปภาพบนหน้าเว็บไซต์</h2><p class="results-meta" id="meta"></p></div>
        <button class="secondary" id="rescanBtn" type="button">ตรวจซ้ำ</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const urlInput=$('url'),viewportInput=$('viewport'),scanBtn=$('scanBtn'),rescanBtn=$('rescanBtn'),status=$('status'),results=$('results'),meta=$('meta'),gallery=$('gallery');
    const ratio=(w,h)=>w&&h?(Math.max(w,h)/Math.min(w,h)).toFixed(2)+':1':'—';
    const size=(w,h)=>w&&h?`${w} × ${h} px`:'—';
    function setStatus(message,type='show'){status.textContent=message;status.className=`status ${type}`}
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function mediaCard(item,index){
      const type=item.kind==='video'?'วิดีโอ':item.kind==='background'?'ภาพพื้นหลัง':'รูปภาพ';
      const src=esc(item.src||'');
      const preview=item.kind==='video'?`<video src="${src}" muted controls preload="metadata"></video>`:`<img src="${src}" alt="รูปภาพลำดับที่ ${index+1}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'broken',textContent:'ไม่สามารถแสดงตัวอย่างได้'}))">`;
      return `<article class="media-card"><div class="preview">${src?preview:'<div class="broken">ไม่มี URL สำหรับแสดงตัวอย่าง</div>'}</div><div class="card-body"><div class="card-top"><span class="type">${type}</span><span class="index">#${index+1}</span></div><div class="data-grid"><div><span class="data-label">ขนาดที่ใช้งานจริง</span><strong class="data-value">${size(item.renderedWidth,item.renderedHeight)}</strong></div><div><span class="data-label">ขนาดต้นฉบับ</span><strong class="data-value">${size(item.naturalWidth,item.naturalHeight)}</strong></div><div><span class="data-label">อัตราส่วน</span><strong class="data-value">${ratio(item.renderedWidth,item.renderedHeight)}</strong></div></div></div></article>`;
    }
    async function scan(){
      const raw=urlInput.value.trim(); if(!raw){setStatus('กรุณาใส่ URL เว็บไซต์ก่อนตรวจสอบ','error');return}
      let parsed;try{parsed=new URL(raw)}catch{setStatus('URL ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง','error');return}
      if(!['http:','https:'].includes(parsed.protocol)){setStatus('รองรับเฉพาะ URL ที่ขึ้นต้นด้วย http:// หรือ https://','error');return}
      const [width,height]=viewportInput.value.split('x').map(Number); scanBtn.disabled=true;scanBtn.innerHTML='<span class="loading"><span class="spinner"></span>กำลังตรวจสอบ</span>';setStatus('กำลังเปิดหน้าเว็บไซต์และอ่านขนาดรูปภาพ…');results.classList.remove('show');
      try{const response=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:parsed.toString(),viewport:{width,height}})});const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error('ระบบตรวจเว็บยังไม่พร้อม หรือ API ไม่ได้ทำงานบนลิงก์นี้')};if(!response.ok)throw new Error(data.error||'ไม่สามารถตรวจสอบเว็บไซต์นี้ได้');
        const items=(data.items||[]).filter(item=>item.visible&&((item.renderedWidth||0)>0)&&((item.renderedHeight||0)>0));meta.textContent=`${data.title||data.url} · ${items.length} รายการ · Viewport ${data.viewport.width} × ${data.viewport.height}`;gallery.innerHTML=items.length?items.map(mediaCard).join(''):'<div class="empty"><strong>ไม่พบรูปภาพที่แสดงอยู่บนหน้านี้</strong>ลองเปลี่ยนขนาดหน้าจอ หรือใช้ URL ของหน้าอื่น</div>';results.classList.add('show');setStatus(`ตรวจสอบเสร็จแล้ว · พบรูปภาพที่แสดงอยู่ ${items.length} รายการ`)
      }catch(error){setStatus(error.message||'เกิดข้อผิดพลาดระหว่างตรวจสอบ','error')}finally{scanBtn.disabled=false;scanBtn.textContent='ตรวจสอบ'}
    }
    scanBtn.addEventListener('click',scan);rescanBtn.addEventListener('click',scan);urlInput.addEventListener('keydown',event=>{if(event.key==='Enter')scan()});
  </script>
</body>
</html>
